const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),dt=s=>new Date(s+'T00:00:00'),addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return ymd(d)},nowT=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};

let SB_OK = false;
async function initStore() {
  try {
    const { error } = await sbClient.from(SB_TABLE).select('key').limit(1);
    if (!error) SB_OK = true;
    else console.warn('Supabase fallback ke browser:', error.message);
  } catch (e) {
    console.warn('Supabase tidak terjangkau, pakai penyimpanan browser:', e);
  }
}

async function kv(m, k, v) {
  if (!SB_OK) return kvIdb(m, k, v);

  if (m === 'get') {
    const { data, error } = await sbClient.from(SB_TABLE).select('value').eq('key', k).maybeSingle();
    if (error) throw error;
    return data ? data.value : undefined;
  }
  if (m === 'set') {
    const { error } = await sbClient.from(SB_TABLE).upsert({ key: k, value: v, updated_at: new Date().toISOString() }, { onConflict: 'key' });
    if (error) throw error;
    kvIdb('set', k, v).catch(()=>{});
    return;
  }
  if (m === 'del') {
    const { error } = await sbClient.from(SB_TABLE).delete().eq('key', k);
    if (error) throw error;
    kvIdb('del', k).catch(()=>{});
    return;
  }
  if (m === 'keys') {
    const { data, error } = await sbClient.from(SB_TABLE).select('key').like('key', 'j:%');
    if (error) throw error;
    return (data || []).map(r => r.key);
  }
}

async function loadAll(){
  const m=await kv('get','meta');
  if(m){S.set=Object.assign(S.set,m.set);S.chk=m.chk||{};S.prev=m.prev||{};S.kpi=m.kpi||{}}
  if (SB_OK) {

}

function calc(){const r=resp(JJ),d=dur(JJ);$('#calc').textContent=[r!=null?'Respon: '+r+' mnt':'',d!=null?'Durasi: '+d+' mnt':'',`Dokumentasi ${docN(JJ)}/6`].filter(x=>x).join(' · ')}
const newJ=(o)=>Object.assign({id:uid(),date:D,cat:0,jenis:'Rutin',lvl:'',title:'',loc:'',asset:'',tIn:'',tS:'',tE:'',init:'',act:'',res:'',st:'Open',bf:[],af:[]},o||{});
function rng(){const t=RP.t;if(t=='h')return[D,D];if(t=='w'){const m=addD(D,-((dt(D).getDay()+6)%7));return[m,addD(m,5)]}return[D.slice(0,7)+'-01',D.slice(0,7)+'-31']}
function rep(){const[a,b]=rng(),J=jobsIn(a,b),m=D.slice(0,7),k=S.kpi[m]||{};
return`<div class="rg"><div class="card rc np"><h3>📄 Atur laporan</h3><div class="chips">${[['h','Harian'],['w','Mingguan'],['b','Bulanan']].map(([v,l])=>`<button class="btn sm ${RP.t==v?'on':''}" data-a="rt" data-v="${v}">${l}</button>`).join('')}</div><label>Tanggal acuan<input type="date" data-d value="${D}"></label>
<label class="row" style="margin:10px 0;color:var(--tx)"><input type="checkbox" style="width:auto" data-a="rph" ${RP.ph?'checked':''}> Sertakan foto Before/After</label>
${RP.t=='b'?`<small>Isi data manual KPI ${fm(m)}:</small><div class="fg">${[['di','Downtime internet (jam)'],['dc','Downtime CCTV (%)'],['ks','Kepuasan user (%)'],['hd','Disiplin & kehadiran (%)']].map(([x,l])=>`<label>${l}<input type="number" step="any" data-k="${x}" value="${k[x]==null?'':k[x]}"></label>`).join('')}</div>`:''}
<button class="btn pr" style="width:100%;margin-top:10px" data-a="print">🖨️ Cetak / Simpan PDF</button><small style="display:block;margin-top:8px;color:var(--mu)">Pratinjau di kanan = hasil cetak. Di dialog cetak pilih “Simpan sebagai PDF”.</small></div><div class="pv">${sheets(J,a,b,m)}</div></div>`}
const head=(t,p)=>`<div class="sh"><div><h1>${t}</h1><div>${esc(S.set.co)} · ${p}</div></div><div style="text-align:right"><b>${esc(S.set.pos)}</b><br>${esc(S.set.tc)}</div></div>`;
function jt(J){return J.length?`<table><tr><th>Tgl</th><th>Jam</th><th>Kategori</th><th>Pekerjaan</th><th>Lokasi</th><th>Jenis</th><th>Status</th><th>Dok</th></tr>${J.map(j=>`<tr><td>${j.date.slice(8)}/${j.date.slice(5,7)}</td><td>${j.tS||'-'}${j.tE?'–'+j.tE:''}</td><td>${CATS[j.cat]}</td><td>${esc(j.title)}</td><td>${esc(j.loc||'-')}</td><td>${j.jenis}</td><td>${j.st}</td><td>${docN(j)}/6</td></tr>`).join('')}</table>`:'<p>Tidak ada pekerjaan pada periode ini.</p>'}
function sum(J){const n=s=>J.filter(j=>j.st==s).length;return`<table><tr><th>Total</th><th>Selesai</th><th>Progress/Open</th><th>Pending</th><th>Runner</th><th>Corrective</th><th>Preventive</th><th>Dokumentasi lengkap</th></tr><tr><td>${J.length}</td><td>${n('Selesai')}</td><td>${n('Open')+n('Progress')}</td><td>${n('Pending')}</td><td>${J.filter(j=>j.cat==4).length}</td><td>${J.filter(j=>j.jenis=='Corrective').length}</td><td>${J.filter(j=>j.jenis=='Preventive').length}</td><td>${J.length?Math.round(J.filter(j=>docN(j)==6).length/J.length*100):0}%</td></tr></table>`}
const imgs=a=>a.length?a.map(s=>`<img src="${s}">`).join(''):'<small>— belum ada foto —</small>';
function docs(J){return J.length?`<h4>Dokumentasi Pekerjaan (Before &amp; After)</h4>`+J.map((j,i)=>`<div class="jb"><b>${i+1}. ${esc(j.title)}</b> — ${j.date.slice(8)}/${j.date.slice(5,7)} · ${esc(j.loc||'-')} · ${j.jenis} · ${j.st}${resp(j)!=null?' · respon '+resp(j)+' mnt':''}${dur(j)!=null?' · durasi '+dur(j)+' mnt':''}<br>${j.asset?'<i>Aset:</i> '+esc(j.asset)+'<br>':''}${j.init?'<i>Kondisi awal:</i> '+esc(j.init)+'<br>':''}${j.act?'<i>Tindakan:</i> '+esc(j.act)+'<br>':''}${j.res?'<i>Hasil:</i> '+esc(j.res):''}${RP.ph?`<div class="pp"><div><i>BEFORE</i>${imgs(j.bf)}</div><div><i>AFTER</i>${imgs(j.af)}</div></div>`:''}</div>`).join(''):''}
function kpiT(J,m){const k=S.kpi[m]||{},n=J.length,av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,pv=PV.filter((_,i)=>(S.prev[m]||{})[i]).length/8*100,ds=new Set(J.map(j=>j.date));Object.keys(S.chk).forEach(d=>{if(d.startsWith(m))ds.add(d)});
const ot=[...ds].filter(d=>S.chk[d]&&S.chk[d].t&&S.chk[d].t<='09:00').length,num=x=>x===''||x==null?null:+x,rs=av(J.map(resp).filter(x=>x!=null)),rl=av(J.filter(j=>j.lvl=='Ringan').map(dur).filter(x=>x!=null)),pc=n?J.filter(j=>j.st=='Selesai').length/n*100:null,dc=n?J.filter(j=>docN(j)==6).length/n*100:null,lp=ds.size?ot/ds.size*100:null;
const R=[['Penyelesaian pekerjaan operasional','≥95%',pc,'%',v=>v>=95,20],['Downtime internet','<2 jam/bulan',num(k.di),' jam',v=>v<2,15],['Downtime CCTV','<1%',num(k.dc),'%',v=>v<1,10],['Preventive maintenance sesuai jadwal','100%',pv,'%',v=>v>=100,15],['Response time keluhan','≤15 menit',rs,' mnt',v=>v<=15,10],['Penyelesaian kendala ringan','≤2 jam',rl,' mnt',v=>v<=120,10],['Ketepatan laporan harian (checklist ≤09.00)','100%',lp,'%',v=>v>=100,5],['Kelengkapan dokumentasi','≥95%',dc,'%',v=>v>=95,5],['Kepuasan user internal','≥90%',num(k.ks),'%',v=>v>=90,5],['Disiplin & kehadiran','≥98%',num(k.hd),'%',v=>v>=98,5]];let sc=0;
const rows=R.map(r=>{const v=r[2],ok=v==null?null:r[4](v);if(ok)sc+=r[5];return`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${v==null?'—':Math.round(v*10)/10+r[3]}</td><td>${r[5]}%</td><td class="${ok?'ok':'bd'}">${ok==null?'Belum ada data':ok?'✓ Tercapai':'✗ Belum'}</td></tr>`}).join('');
return`<h4>Indikator KPI</h4><table><tr><th>KPI</th><th>Target</th><th>Capaian</th><th>Bobot</th><th>Status</th></tr>${rows}<tr><th colspan="3">Skor (bobot KPI tercapai)</th><th colspan="2">${sc} / 100</th></tr></table>`}
function sheets(J,a,b,m){const t=RP.t,c=S.chk[a]||{};let h;
if(t=='h')h=`<div class="sheet">${head('DAILY ACTIVITY REPORT',fd(a))}<h4>Pemeriksaan Awal Operasional (SOP 1)</h4><table><tr><th>Item</th><th>Status</th></tr>${CK.map((x,i)=>`<tr><td>${x}</td><td>${{ok:'<span class=ok>OK</span>',bad:'<span class=bd>Temuan</span>',na:'N/A'}[c[i]]||'Belum diperiksa'}</td></tr>`).join('')}</table><small>${c.t?'Selesai pukul '+c.t:''}</small><h4>Ringkasan</h4>${sum(J)}<h4>Daftar Pekerjaan</h4>${jt(J)}${docs(J)}<div class="sg">Operational Runner<div>${esc(S.set.tc)}</div></div></div>`;
else if(t=='w'){const ds=[0,1,2,3,4,5].map(i=>addD(a,i));h=`<div class="sheet">${head('LAPORAN MINGGUAN',fd(a)+' – '+fd(b))}<h4>Ringkasan Minggu</h4>${sum(J)}<h4>Per Hari</h4><table><tr><th>Hari</th><th>Pekerjaan</th><th>Selesai</th><th>Pending</th><th>Checklist awal</th></tr>${ds.map(d=>{const x=J.filter(j=>j.date==d),cc=S.chk[d]||{};return`<tr><td>${fd(d)}</td><td>${x.length}</td><td>${x.filter(j=>j.st=='Selesai').length}</td><td>${x.filter(j=>j.st=='Pending').length}</td><td>${CK.filter((_,i)=>cc[i]).length}/7${CK.some((_,i)=>cc[i]=='bad')?' · ada temuan':''}</td></tr>`}).join('')}</table><h4>Daftar Pekerjaan</h4>${jt(J)}${docs(J)}<div class="sg">Operational Runner<div>${esc(S.set.tc)}</div></div></div>`}
else h=`<div class="sheet">${head('LAPORAN BULANAN',fm(m))}<h4>Ringkasan Bulan</h4>${sum(J)}<h4>Per Kategori</h4><table><tr><th>Kategori</th><th>Jumlah</th><th>Selesai</th></tr>${CATS.map((x,i)=>`<tr><td>${x}</td><td>${J.filter(j=>j.cat==i).length}</td><td>${J.filter(j=>j.cat==i&&j.st=='Selesai').length}</td></tr>`).join('')}</table>${kpiT(J,m)}<h4>Preventive Maintenance (SOP 3)</h4><table><tr>${PV.map(x=>`<th>${x}</th>`).join('')}</tr><tr>${PV.map((_,i)=>`<td>${(S.prev[m]||{})[i]?'<span class=ok>✓</span>':'—'}</td>`).join('')}</tr></table></div><div class="sheet pb">${head('LAMPIRAN PEKERJAAN',fm(m))}${jt(J)}${docs(J)}<div class="sg">Operational Runner<div>${esc(S.set.tc)}</div></div></div>`;return h}
function sets(){return`<div class="card" style="max-width:640px"><h3>⚙️ Identitas laporan</h3><div class="g2">${[['co','Perusahaan'],['tc','Nama'],['pos','Jabatan']].map(([k,l])=>`<label>${l}<input data-s="${k}" value="${esc(S.set[k])}"></label>`).join('')}</div><h3>💾 Cadangan data</h3><p style="margin:0 0 8px;color:var(--mu);font-size:13px">${SB_OK?'Data tersinkronisasi otomatis ke database Supabase Anda. Anda tetap bisa mengunduh file JSON sebagai arsip lokal.':'Data tersimpan di browser ini. Buat cadangan rutin.'}</p><div class="row"><button class="btn" data-a="exp">⬇️ Unduh file</button><button class="btn" data-a="cpy">📋 Salin teks</button><label class="btn" style="cursor:pointer">⬆️ Impor file<input type="file" accept=".json" hidden data-imp></label></div><textarea id="jt" rows="4" style="margin-top:10px" placeholder="Atau tempel teks cadangan lalu tekan Impor teks"></textarea><button class="btn" style="margin-top:8px" data-a="imt">Impor teks</button></div>`}
const dump=()=>JSON.stringify({v:2,set:S.set,chk:S.chk,prev:S.prev,kpi:S.kpi,jobs:S.jobs});
async function doImport(x){try{const o=JSON.parse(x);if(!o||!Array.isArray(o.jobs))throw 0;const ids=new Set(S.jobs.map(j=>j.id));for(const j of o.jobs)if(!ids.has(j.id)){S.jobs.push(j);await saveJob(j)}Object.assign(S.chk,o.chk||{});Object.assign(S.prev,o.prev||{});Object.assign(S.kpi,o.kpi||{});await saveMeta();toast('✓ Impor berhasil');V='home';render()}catch(e){toast('⚠️ Cadangan tidak valid')}}
const A={nav:e=>{V=e.dataset.v;render()},go:e=>{D=e.dataset.d;render(1)},fs:e=>{FS=e.dataset.v;render(1)},close:()=>$('#dlg').close(),
ck:e=>{const c=S.chk[D]||(S.chk[D]={}),i=e.dataset.i;c[i]=c[i]==e.dataset.v?'':e.dataset.v;if(CK.every((_,x)=>c[x])){if(!c.t)c.t=nowT()}else delete c.t;saveMeta();render(1)},
allok:()=>{const c=S.chk[D]||(S.chk[D]={});CK.forEach((_,i)=>{if(!c[i])c[i]='ok'});if(!c.t)c.t=nowT();saveMeta();render(1)},
fromck:e=>{const i=+e.dataset.i;jobDlg(newJ({cat:CKC[i],jenis:'Corrective',title:'Temuan: '+CK[i],init:'Ditemukan saat pemeriksaan awal: '+CK[i]+' tidak normal.'}))},
newj:()=>jobDlg(newJ()),tpl:e=>{const t=TP[+e.dataset.i];jobDlg(newJ({title:t[0],cat:t[1],jenis:t[2]}))},editj:e=>jobDlg(JSON.parse(JSON.stringify(S.jobs.find(j=>j.id==e.dataset.id)))),
tnow:e=>{JJ[e.dataset.k]=nowT();if(e.dataset.k=='tE')JJ.st='Selesai';jobDlg(JJ)},
dph:e=>{JJ[e.dataset.k].splice(+e.dataset.i,1);$('#ph_'+e.dataset.k).innerHTML=phH(e.dataset.k);calc()},
savej:async()=>{if(!JJ.title.trim())return toast('Isi nama pekerjaan dulu');try{const i=S.jobs.findIndex(j=>j.id==JJ.id);i>=0?S.jobs[i]=JJ:S.jobs.push(JJ);await saveJob(JJ);D=JJ.date;$('#dlg').close();toast('Tersimpan ✓');render(1)}catch(e){toast('⚠️ Gagal menyimpan — cek koneksi Supabase atau ruang penyimpanan.',5000)}},
yes:()=>{const f=ASK;ASK=null;$('#dlg').close();f&&f()},delj:e=>{const id=e.dataset.id;ask('Hapus pekerjaan ini? Foto dan catatannya ikut terhapus.',async()=>{S.jobs=S.jobs.filter(j=>j.id!=id);await kv('del','j:'+id);toast('Terhapus');render(1)})},
esok:async e=>{const j=S.jobs.find(x=>x.id==e.dataset.id),n=newJ({date:addD(j.date,1),cat:j.cat,jenis:j.jenis,lvl:j.lvl,title:j.title,loc:j.loc,asset:j.asset,init:'Lanjutan dari '+j.date+(j.act?'. Sudah dilakukan: '+j.act:'')});j.st='Pending';S.jobs.push(n);await saveJob(j);await saveJob(n);toast('→ Dipindah ke esok (asli ditandai Pending)');render(1)},
pv:e=>{const m=D.slice(0,7),p=S.prev[m]||(S.prev[m]={});p[e.dataset.i]=e.checked;saveMeta();render(1)},
rt:e=>{RP.t=e.dataset.v;render(1)},rph:e=>{RP.ph=e.checked;render(1)},print:()=>{try{window.print()}catch(e){toast('Cetak diblokir — buka halaman di tab baru')}},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dump()],{type:'application/json'}));a.download='runner-backup-'+TD+'.json';a.click();toast('Jika tidak terunduh, pakai “Salin teks”',4000)},
cpy:async()=>{try{await navigator.clipboard.writeText(dump());toast('✓ Cadangan disalin')}catch(e){$('#jt').value=dump();$('#jt').select();toast('Salin manual (Ctrl+C)')}},imt:()=>doImport($('#jt').value)};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName=='INPUT'&&el.type!='checkbox'||el.tagName=='LABEL')return;if(A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('input',e=>{const el=e.target;
if(el.dataset.f&&JJ){JJ[el.dataset.f]=el.dataset.f=='cat'?+el.value:el.value;if(['tIn','tS','tE'].includes(el.dataset.f)||el.tagName=='SELECT'||el.dataset.f=='title'||el.dataset.f=='loc')calc();return}
if(el.dataset.s){S.set[el.dataset.s]=el.value;saveMeta()}
if(el.dataset.k){const m=D.slice(0,7);(S.kpi[m]||(S.kpi[m]={}))[el.dataset.k]=el.value;saveMeta()}});
document.addEventListener('change',async e=>{const el=e.target;
if(el.dataset.d!==undefined&&el.value){D=el.value;render(1)}
if(el.dataset.ph&&JJ){const k=el.dataset.ph;for(const f of [...el.files]){if(JJ[k].length>=4){toast('Maksimal 4 foto per sisi');break}const c=await comp(f);if(c)JJ[k].push(c)}$('#ph_'+k).innerHTML=phH(k);el.value='';calc()}
if(el.dataset.imp!==undefined&&el.files[0])doImport(await el.files[0].text())});
initStore().then(loadAll).then(()=>{stor();render()}).catch(()=>{$('#stor').textContent='⚠️ Gagal memuat data, coba refresh';render()});
</script></body></html>
